<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR-AI Dashboard - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #1e293b;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.15s ease-in-out;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            text-align: center;
            width: 100%;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
            margin-top: 0.5rem;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .message {
            padding: 0.75rem;
            border-radius: 6px;
            margin: 1rem 0;
            text-align: center;
        }

        .error-message {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .success-message {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .demo-accounts {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .demo-account {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background: white;
            border-radius: 4px;
            border-left: 3px solid #3b82f6;
        }

        .hidden {
            display: none;
        }

        .form-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .form-buttons .btn {
            flex: 1;
        }

        .link-button {
            background: none;
            border: none;
            color: #3b82f6;
            cursor: pointer;
            text-decoration: underline;
        }

        .link-button:hover {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Login Form -->
        <div id="loginCard" class="login-card">
            <div class="login-header">
                <h1>🚀 HR-AI Dashboard</h1>
                <p>Intelligent Performance Management System</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Login</button>
                
                <div id="loginMessage" class="message hidden"></div>
            </form>
            
            <div class="demo-accounts">
                <p style="text-align: center; margin-bottom: 1rem;"><strong>Demo Accounts:</strong></p>
                <div class="demo-account">
                    <strong>HR Manager:</strong> admin / admin123
                </div>
                <div class="demo-account">
                    <strong>Employee:</strong> john / john123
                </div>
                <div style="text-align: center; margin-top: 1rem;">
                    <button type="button" class="link-button" onclick="showRegisterForm()">Create New Employee Account</button>
                </div>
            </div>
        </div>
        
        <!-- Registration Form -->
        <div id="registerCard" class="login-card hidden">
            <div class="login-header">
                <h2>Create Employee Account</h2>
                <p>Join the performance management system</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" name="fullName" required>
                </div>
                
                <div class="form-group">
                    <label for="regDepartment">Department</label>
                    <select id="regDepartment" name="department" required>
                        <option value="">Select Department</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Sales">Sales</option>
                        <option value="Marketing">Marketing</option>
                        <option value="HR">Human Resources</option>
                        <option value="Finance">Finance</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="password" required>
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Register</button>
                    <button type="button" class="btn btn-secondary" onclick="showLoginForm()">Back to Login</button>
                </div>
                
                <div id="registerMessage" class="message hidden"></div>
            </form>
        </div>
    </div>

    <script>
        // Initialize demo data and users
        function initializeDemoData() {
            if (!localStorage.getItem('hr_ai_users')) {
                const demoUsers = [
                    {
                        id: 1,
                        username: 'admin',
                        password: 'admin123',
                        email: 'admin@company.com',
                        fullName: 'HR Administrator',
                        role: 'hr',
                        department: 'HR',
                        joinDate: '2024-01-01'
                    },
                    {
                        id: 2,
                        username: 'john',
                        password: 'john123',
                        email: 'john@company.com',
                        fullName: 'John Doe',
                        role: 'employee',
                        department: 'Engineering',
                        joinDate: '2024-03-15'
                    },
                    {
                        id: 3,
                        username: 'sarah',
                        password: 'sarah123',
                        email: 'sarah@company.com',
                        fullName: 'Sarah Wilson',
                        role: 'employee',
                        department: 'Sales',
                        joinDate: '2024-02-01'
                    },
                    {
                        id: 4,
                        username: 'mike',
                        password: 'mike123',
                        email: 'mike@company.com',
                        fullName: 'Mike Johnson',
                        role: 'employee',
                        department: 'Marketing',
                        joinDate: '2024-04-10'
                    }
                ];
                
                localStorage.setItem('hr_ai_users', JSON.stringify(demoUsers));
                
                // Initialize demo data for employees
                generateDemoEmployeeData();
            }
        }

        function generateDemoEmployeeData() {
            const achievements = [
                {
                    id: 1,
                    employeeId: 2,
                    title: 'Completed Major Project',
                    description: 'Successfully delivered the client portal system ahead of schedule',
                    impactScore: 9,
                    date: '2025-08-15',
                    category: 'Project Delivery'
                },
                {
                    id: 2,
                    employeeId: 2,
                    title: 'Code Quality Improvement',
                    description: 'Reduced bug reports by 40% through improved testing practices',
                    impactScore: 8,
                    date: '2025-07-20',
                    category: 'Quality'
                },
                {
                    id: 3,
                    employeeId: 3,
                    title: 'Sales Target Achievement',
                    description: 'Exceeded quarterly sales target by 120%',
                    impactScore: 10,
                    date: '2025-09-01',
                    category: 'Sales'
                },
                {
                    id: 4,
                    employeeId: 3,
                    title: 'New Client Acquisition',
                    description: 'Brought in 5 new enterprise clients worth $2M ARR',
                    impactScore: 9,
                    date: '2025-08-10',
                    category: 'Business Development'
                },
                {
                    id: 5,
                    employeeId: 4,
                    title: 'Campaign Success',
                    description: 'Led digital marketing campaign with 300% ROI',
                    impactScore: 8,
                    date: '2025-07-25',
                    category: 'Marketing'
                }
            ];

            const tasks = [
                {
                    id: 1,
                    employeeId: 2,
                    title: 'Code Review',
                    description: 'Reviewed pull requests for team members',
                    hoursSpent: 8,
                    status: 'completed',
                    date: '2025-09-10'
                },
                {
                    id: 2,
                    employeeId: 2,
                    title: 'Database Optimization',
                    description: 'Optimized slow queries in production database',
                    hoursSpent: 12,
                    status: 'completed',
                    date: '2025-09-08'
                },
                {
                    id: 3,
                    employeeId: 3,
                    title: 'Client Presentation',
                    description: 'Presented product demo to potential client',
                    hoursSpent: 4,
                    status: 'completed',
                    date: '2025-09-12'
                },
                {
                    id: 4,
                    employeeId: 3,
                    title: 'Sales Report Analysis',
                    description: 'Analyzed quarterly sales performance data',
                    hoursSpent: 6,
                    status: 'completed',
                    date: '2025-09-05'
                }
            ];

            const metrics = [
                {
                    id: 1,
                    employeeId: 2,
                    type: 'Code Quality Score',
                    value: 92,
                    target: 85,
                    month: 9,
                    year: 2025
                },
                {
                    id: 2,
                    employeeId: 2,
                    type: 'Sprint Completion',
                    value: 95,
                    target: 90,
                    month: 9,
                    year: 2025
                },
                {
                    id: 3,
                    employeeId: 3,
                    type: 'Sales Revenue',
                    value: 240000,
                    target: 200000,
                    month: 9,
                    year: 2025
                },
                {
                    id: 4,
                    employeeId: 3,
                    type: 'Customer Satisfaction',
                    value: 4.8,
                    target: 4.5,
                    month: 9,
                    year: 2025
                }
            ];

            localStorage.setItem('hr_ai_achievements', JSON.stringify(achievements));
            localStorage.setItem('hr_ai_tasks', JSON.stringify(tasks));
            localStorage.setItem('hr_ai_metrics', JSON.stringify(metrics));
        }

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('loginMessage');
            
            const users = JSON.parse(localStorage.getItem('hr_ai_users') || '[]');
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                localStorage.setItem('hr_ai_current_user', JSON.stringify(user));
                
                if (user.role === 'hr') {
                    window.location.href = 'hr-dashboard.html';
                } else {
                    window.location.href = 'employee-dashboard.html';
                }
            } else {
                showMessage(messageDiv, 'Invalid username or password', 'error');
            }
        });

        // Registration form handler
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const userData = Object.fromEntries(formData.entries());
            const messageDiv = document.getElementById('registerMessage');
            
            const users = JSON.parse(localStorage.getItem('hr_ai_users') || '[]');
            
            // Check if username already exists
            if (users.find(u => u.username === userData.username)) {
                showMessage(messageDiv, 'Username already exists', 'error');
                return;
            }
            
            // Check if email already exists
            if (users.find(u => u.email === userData.email)) {
                showMessage(messageDiv, 'Email already registered', 'error');
                return;
            }
            
            // Create new user
            const newUser = {
                id: users.length + 1,
                username: userData.username,
                password: userData.password,
                email: userData.email,
                fullName: userData.fullName,
                department: userData.department,
                role: 'employee',
                joinDate: new Date().toISOString().split('T')[0]
            };
            
            users.push(newUser);
            localStorage.setItem('hr_ai_users', JSON.stringify(users));
            
            showMessage(messageDiv, 'Account created successfully! You can now login.', 'success');
            document.getElementById('registerForm').reset();
            
            setTimeout(() => {
                showLoginForm();
            }, 2000);
        });

        function showLoginForm() {
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('registerCard').classList.add('hidden');
        }

        function showRegisterForm() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('registerCard').classList.remove('hidden');
        }

        function showMessage(element, message, type) {
            element.textContent = message;
            element.className = `message ${type}-message`;
            element.classList.remove('hidden');
            
            setTimeout(() => {
                element.classList.add('hidden');
            }, 5000);
        }

        // Initialize demo data on page load
        initializeDemoData();

        // Auto-redirect if already logged in
        const currentUser = localStorage.getItem('hr_ai_current_user');
        if (currentUser) {
            const user = JSON.parse(currentUser);
            if (user.role === 'hr') {
                window.location.href = 'hr-dashboard.html';
            } else {
                window.location.href = 'employee-dashboard.html';
            }
        }
    </script>
</body>
</html>
