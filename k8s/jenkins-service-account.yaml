apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: hr-ai

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: hr-ai
rules:
- apiGroups: ["", "apps", "extensions"]
  resources:
    - pods
    - deployments
    - services
    - configmaps
    - secrets
    - replicasets
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources:
    - pods/log
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: hr-ai
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: hr-ai
roleRef:
  kind: Role
  name: jenkins-deployer
  apiGroup: rbac.authorization.k8s.io

